name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    # Xcode 27 есть только на превью-образе xcode-27 (macOS 27)
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # номер билда = число коммитов

      - name: Select Xcode
        run: |
          set -euo pipefail
          WANT=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          echo "versions.json wants Xcode $WANT"
          ls -d /Applications/Xcode*.app || true
          if [ -d "/Applications/Xcode_$WANT.app" ]; then
            XCODE="/Applications/Xcode_$WANT.app"
          else
            XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)
            [ -n "$XCODE" ] || XCODE=/Applications/Xcode.app
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Check Whygram signing and storage migration
        run: |
          set -euo pipefail
          xcrun swiftc -o "$RUNNER_TEMP/whygram-storage-tests" \
            Swiftgram/SGAppGroupIdentifier/Sources/*.swift \
            Tests/WhygramStorage/main.swift
          "$RUNNER_TEMP/whygram-storage-tests"

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          sudo chown "$(whoami)" /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios

      # Дисковый кэш Bazel: скомпилированные модули переиспользуются между сборками,
      # пересобирается только то, что поменялось. Ключ уникален для каждого запуска,
      # чтобы кэш обновлялся; восстанавливается самый свежий.
      - name: Restore Bazel cache
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /Users/Shared/telegram-ios/build-input
            /Users/Shared/bazel-disk-cache
            /private/var/tmp/_bazel_containerhost/cache
          key: bazel-${{ runner.os }}-${{ hashFiles('versions.json') }}-${{ github.run_id }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ hashFiles('versions.json') }}-
            bazel-${{ runner.os }}-

      - name: Generate build configuration
        # api_id / api_hash берутся из секретов репозитория (Settings → Secrets → Actions).
        # Never silently ship the official client's public API credentials.
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BUNDLE_ID: ${{ vars.TG_BUNDLE_ID }}
          TG_TEAM_ID: ${{ vars.TG_TEAM_ID }}
        run: |
          cd /Users/Shared/telegram-ios
          python3 - <<'EOF'
          import json, os
          api_id = os.environ.get('TG_API_ID', '').strip()
          api_hash = os.environ.get('TG_API_HASH', '').strip()
          if not api_id.isdecimal() or int(api_id) <= 0:
              raise SystemExit('Set the TG_API_ID repository Actions secret to your my.telegram.org api_id')
          if int(api_id) == 8:
              raise SystemExit('TG_API_ID must be your own API ID, not the official Telegram test ID')
          if len(api_hash) != 32 or any(c not in '0123456789abcdefABCDEF' for c in api_hash):
              raise SystemExit('Set the TG_API_HASH repository Actions secret to your my.telegram.org api_hash')
          src = 'build-system/appstore-configuration.json'
          cfg = json.load(open(src))
          cfg.setdefault('sg_config', '{}')
          # Re-signed builds cannot use Telegram's CloudKit container. Calling
          # CKContainer.default() without its entitlements aborts during startup.
          cfg['enable_icloud'] = False
          cfg['api_id'] = api_id
          cfg['api_hash'] = api_hash
          print('Telegram API credentials: validated repository secrets')
          for key, env in [('bundle_id', 'TG_BUNDLE_ID'), ('team_id', 'TG_TEAM_ID')]:
              if os.environ.get(env):
                  cfg[key] = os.environ[env]
                  print(f'{key}: from {env}')
          json.dump(cfg, open('build-system/ci-configuration.json', 'w'), indent=2)
          EOF

      # Фейковые профили из репозитория Swiftgram истекли (2026-10-30), а rules_apple
      # проверяет ExpirationDate. Подпись профиля при сборке не проверяется (-noverify),
      # поэтому продлеваем даты и переподписываем тем же фейковым сертификатом.
      - name: Refresh fake provisioning profiles
        run: |
          set -euo pipefail
          cd /Users/Shared/telegram-ios/build-system/fake-codesigning
          P12=certs/SelfSigned.p12
          openssl pkcs12 -in "$P12" -passin pass: -nodes -out "$RUNNER_TEMP/fake.pem" 2>/dev/null \
            || openssl pkcs12 -legacy -in "$P12" -passin pass: -nodes -out "$RUNNER_TEMP/fake.pem"
          for p in profiles/*.mobileprovision; do
            security cms -D -i "$p" -o "$RUNNER_TEMP/profile.plist"
            python3 - "$RUNNER_TEMP/profile.plist" <<'EOF'
          import datetime, plistlib, sys
          path = sys.argv[1]
          with open(path, 'rb') as f:
              d = plistlib.load(f)
          now = datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None, microsecond=0)
          d['CreationDate'] = now - datetime.timedelta(days=1)
          d['ExpirationDate'] = now + datetime.timedelta(days=3650)
          d['TimeToLive'] = 3650
          with open(path, 'wb') as f:
              plistlib.dump(d, f)
          print(path, d.get('Name'), '->', d['ExpirationDate'])
          EOF
            openssl smime -sign -binary -nodetach -outform der \
              -signer "$RUNNER_TEMP/fake.pem" -inkey "$RUNNER_TEMP/fake.pem" \
              -in "$RUNNER_TEMP/profile.plist" -out "$p"
            security cms -D -i "$p" | plutil -extract ExpirationDate raw -o - -
          done

      - name: Build the App
        run: |
          set -x
          # пути к исходникам попадают в бинарник, поэтому каталог фиксированный
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          export APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          export BUILD_NUMBER="$(( $(git rev-list --count HEAD) + BUILD_NUMBER_OFFSET ))"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir=/Users/Shared/bazel-disk-cache \
            build --continueOnError \
            --configurationPath="build-system/ci-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

      - name: Collect artifacts
        run: |
          set -euxo pipefail
          cd /Users/Shared/telegram-ios
          OUTPUT_PATH="$PWD/build/artifacts"
          rm -rf "$OUTPUT_PATH" build/DSYMs; mkdir -p "$OUTPUT_PATH" build/DSYMs
          cp -L bazel-bin/Telegram/Swiftgram.ipa "$OUTPUT_PATH/Whygram.ipa"
          for f in bazel-bin/Telegram/*.dSYM; do
            cp -RL "$f" build/DSYMs/
          done
          (cd build && zip -qr "$OUTPUT_PATH/Whygram.DSYMs.zip" DSYMs)
          ls -la "$OUTPUT_PATH"

      # Сохраняем кэш даже при упавшей сборке, чтобы не компилировать всё заново.
      - name: Save Bazel cache
        if: always() && steps.bazel-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            /Users/Shared/telegram-ios/build-input
            /Users/Shared/bazel-disk-cache
            /private/var/tmp/_bazel_containerhost/cache
          key: bazel-${{ runner.os }}-${{ hashFiles('versions.json') }}-${{ github.run_id }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Whygram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/*
          retention-days: 14

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: Whygram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: Unsigned build of Whygram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }}). Подпиши перед установкой (xtool / AltStore / Sideloadly).
          files: |
            /Users/Shared/telegram-ios/build/artifacts/Whygram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Whygram.DSYMs.zip
