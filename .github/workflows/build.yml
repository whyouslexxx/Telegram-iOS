name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    # Xcode 27 есть только на превью-образе xcode-27 (macOS 27)
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # номер билда = число коммитов

      - name: Select Xcode
        run: |
          set -euo pipefail
          WANT=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          echo "versions.json wants Xcode $WANT"
          ls -d /Applications/Xcode*.app || true
          if [ -d "/Applications/Xcode_$WANT.app" ]; then
            XCODE="/Applications/Xcode_$WANT.app"
          else
            XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)
            [ -n "$XCODE" ] || XCODE=/Applications/Xcode.app
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          sudo chown "$(whoami)" /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios

      # Дисковый кэш Bazel: скомпилированные модули переиспользуются между сборками,
      # пересобирается только то, что поменялось. Ключ уникален для каждого запуска,
      # чтобы кэш обновлялся; восстанавливается самый свежий.
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            /Users/Shared/telegram-ios/build-input
            /Users/Shared/bazel-disk-cache
            /private/var/tmp/_bazel_containerhost/cache
          key: bazel-${{ runner.os }}-${{ hashFiles('versions.json') }}-${{ github.run_id }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ hashFiles('versions.json') }}-
            bazel-${{ runner.os }}-

      - name: Generate build configuration
        # api_id / api_hash берутся из секретов репозитория (Settings → Secrets → Actions).
        # Без секретов используются публичные тестовые значения из appstore-configuration.json.
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BUNDLE_ID: ${{ vars.TG_BUNDLE_ID }}
          TG_TEAM_ID: ${{ vars.TG_TEAM_ID }}
        run: |
          cd /Users/Shared/telegram-ios
          python3 - <<'EOF'
          import json, os
          src = 'build-system/appstore-configuration.json'
          cfg = json.load(open(src))
          cfg.setdefault('sg_config', '{}')
          for key, env in [('api_id', 'TG_API_ID'), ('api_hash', 'TG_API_HASH'),
                           ('bundle_id', 'TG_BUNDLE_ID'), ('team_id', 'TG_TEAM_ID')]:
              if os.environ.get(env):
                  cfg[key] = os.environ[env]
                  print(f'{key}: from {env}')
          json.dump(cfg, open('build-system/ci-configuration.json', 'w'), indent=2)
          EOF

      - name: Build the App
        run: |
          set -x
          # пути к исходникам попадают в бинарник, поэтому каталог фиксированный
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          export APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          export BUILD_NUMBER="$(( $(git rev-list --count HEAD) + BUILD_NUMBER_OFFSET ))"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir=/Users/Shared/bazel-disk-cache \
            build \
            --configurationPath="build-system/ci-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="$SOURCE_DIR/build/artifacts"
          rm -rf "$OUTPUT_PATH"; mkdir -p "$OUTPUT_PATH" build/DSYMs
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            cp "$f" "$OUTPUT_PATH/Swiftgram.ipa"
          done
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/*.dSYM; do
            cp -R "$f" build/DSYMs/
          done
          (cd build && zip -qr "$OUTPUT_PATH/Swiftgram.DSYMs.zip" DSYMs)
          ls -la "$OUTPUT_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swiftgram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/*
          retention-days: 14

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: Swiftgram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: Unsigned build of Swiftgram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }}). Подпиши перед установкой (xtool / AltStore / Sideloadly).
          files: |
            /Users/Shared/telegram-ios/build/artifacts/Swiftgram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Swiftgram.DSYMs.zip
